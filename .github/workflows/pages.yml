name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build cadcam.js and cadcam.wasm (single-threaded, see web/BUILD.md)
        run: |
          emcmake cmake -S web -B builds/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build builds/wasm
          test -f web/cadcam.js && test -f web/cadcam.wasm
      - name: Fetch libcascade 3.1.0 single-threaded WASM
        run: |
          python3 web/fetch-libcascade.py
          test -f web/dist/opencascade_single.wasm
          test -f web/occt-gate.mjs
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp web/index.html web/cadcam.js web/cadcam.wasm web/*.mjs _site/
          cp web/dist/init.single.js web/dist/opencascade_single.js web/dist/opencascade_single.wasm _site/dist/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4